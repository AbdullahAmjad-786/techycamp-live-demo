# =====================================================================
#  Our "robot assistant". On every push to main it:
#    1. TEST    - runs the automated tests
#    2. PACKAGE - builds the Docker image and stores it in GitHub's registry
#    3. DEPLOY  - puts the new version live on Azure Container Apps
#  If a step fails, the next ones never run - broken code never goes live.
# =====================================================================
name: TechyCamp CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # push images to GitHub Container Registry (ghcr.io)
  id-token: write   # passwordless (OIDC) login to Azure

env:
  IMAGE_NAME: techycamp-live-demo

jobs:
  # ---------------------------------------------------------------
  test:
    name: 1. Test
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Run automated tests
        run: npm test

  # ---------------------------------------------------------------
  package:
    name: 2. Build & push Docker image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.vars.outputs.image }}
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Work out the image name
        id: vars
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$OWNER/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "latest=ghcr.io/$OWNER/${{ env.IMAGE_NAME }}:latest" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}
            ${{ steps.vars.outputs.latest }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.vars.outputs.time }}

      - name: Summary
        run: |
          echo "### 📦 Image ready" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.vars.outputs.image }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Run it anywhere: \`docker run -p 8080:3000 ${{ steps.vars.outputs.image }}\`" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------
  # Runs only after you set the repo variable DEPLOY_TO_AZURE = true
  # (see infra/setup-azure.sh). Until then the pipeline stops at step 2.
  deploy:
    name: 3. Deploy to Azure
    needs: package
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_TO_AZURE == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Log in to Azure (no passwords - OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Roll out the new version
        id: deploy
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az containerapp update \
            --name "${{ vars.AZURE_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ needs.package.outputs.image }}" \
            --set-env-vars RUNNING_ON="Azure Container Apps" \
            --output none
          FQDN=$(az containerapp show \
            --name "${{ vars.AZURE_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "url=https://$FQDN" >> "$GITHUB_OUTPUT"

      - name: Smoke test - is the new version really live?
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "${{ steps.deploy.outputs.url }}/api/info" | grep -q "${GITHUB_SHA:0:7}"; then
              echo "✅ New version is live"; exit 0
            fi
            echo "Waiting for the new version... ($i/20)"; sleep 6
          done
          echo "❌ New version did not come up in time"; exit 1

      - name: Summary
        run: |
          echo "### 🚀 Live on Azure" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
